<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Docs Side-by-Side — Ticket</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; padding: 28px 32px;
      font: 17px/1.5 system-ui, -apple-system, sans-serif;
      color: #172b4d; background: #fff;
    }
    a { color: #0052cc; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .key { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
    h1 {
      margin: 6px 0 18px; font-size: 26px; line-height: 1.3; font-weight: 650;
      overflow-wrap: anywhere;
    }

    .badges { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 22px; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 5px;
      font-size: 14px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .04em; color: #fff; background: #6b778c;
    }
    .badge .cat { font-weight: 500; opacity: .85; text-transform: none; }

    .meta { margin: 0 0 6px; color: #44546f; }
    .meta b { color: #172b4d; }

    .note {
      margin-top: 26px; padding: 14px 16px; border-radius: 8px;
      background: #fff7e6; color: #7a5c00; border: 1px solid #ffe1a6;
    }
    .note a { font-weight: 600; }
    .activity {
      margin-top: 24px; padding: 14px 16px; border-radius: 8px;
      background: #f4f5f7; border-left: 4px solid #0052cc;
    }
    .activity.status { border-left-color: #00875a; }
    .activity .who { margin-bottom: 6px; font-size: 13px; font-weight: 600; color: #6b778c; }
    .activity .body { white-space: pre-wrap; overflow-wrap: anywhere; }
    .spinner { color: #6b778c; }
    #freshness { margin-top: 20px; font-size: 13px; color: #6b778c; }
    #freshness.changed { color: #00875a; font-weight: 600; }
    footer { margin-top: 14px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="key"><a id="key-link" target="_blank"></a></div>
  <h1 id="summary" class="spinner">Loading…</h1>
  <div class="badges" id="badges"></div>
  <div id="meta"></div>
  <div id="activity"></div>
  <div id="message"></div>
  <div id="freshness"></div>
  <footer><a id="open-link" target="_blank">Open in Jira ↗</a></footer>
  <script src="viewer.js"></script>
</body>
</html>
